
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألبوم دمشق | النظرة الثقافية</title>
    <link rel="stylesheet" href="../css/Damascus-album.css">
</head>
<body>

<main class="museum" data-album>

    <header class="museum-header">
        <a href="Cultural-model-5.html" class="museum-brand">
            <span class="brand-symbol">د</span>
            <span>النظرة الثقافية<small>دمشق · ألبوم بصري</small></span>
        </a>

        <a href="Cultural-model-5.html" class="back-link">
            العودة إلى الصفحة الرئيسية ↗
        </a>
    </header>

    <div class="scene">
        <div class="scene-background"></div>

        <div class="camera" data-camera>
            <div class="room" data-room>

                <div class="room-wall room-wall-left"></div>
                <div class="room-wall room-wall-right"></div>
                <div class="room-floor"></div>
                <div class="room-ceiling"></div>
                <div class="room-back"></div>

                <div class="room-light light-one"></div>
                <div class="room-light light-two"></div>
                <div class="room-light light-three"></div>

                <div class="gallery" data-gallery></div>

            </div>
        </div>

        <div class="intro-overlay" data-intro>
            <span class="intro-kicker">DAMASCUS · CULTURAL ARCHIVE</span>
            <h1>حكاية مدينة<br>عبر الزمن</h1>
            <p>ادخل إلى ذاكرة دمشق، واكتشف حكاياتها لوحةً بعد أخرى.</p>
            <button type="button" data-enter>
                ابدأ الجولة <span>↓</span>
            </button>
        </div>

        <div class="scene-vignette"></div>
    </div>

    <aside class="museum-ui">
        <div class="location-label">
            <span class="status-dot"></span>
            <span data-location>مدخل الغرفة</span>
        </div>

        <div class="progress-area">
            <span data-current>00</span>
            <div class="progress-track">
                <span data-progress></span>
            </div>
            <span data-total>06</span>
        </div>

        <div class="movement-hint" data-hint>
            مرّر للأسفل للتقدم داخل الغرفة
            <span>↓</span>
        </div>
    </aside>

    <div class="scroll-track" data-scroll-track aria-hidden="true"></div>

</main>

<script src="../js/Damascus-album.js"></script>
</body>
</html>
