<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>تفاصيل الدليل - محافظة دمشق</title>

    <link rel="icon" href="../../images/brand/logo.png" type="image/png" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
    
:root {
  --sd-primary: var(--green-900);
  --sd-primary-hover: #0b5a4d;
  --sd-accent: var(--teal-600);
  --sd-band: #e8f0ea;
  --sd-page: #fbfaf7;
  --sd-line: #e4e0d6;
  --sd-muted: #66736c;
  --sd-soft: #f2f0ea;
}

body {
  position: relative;
  isolation: isolate;
}

/* =====================================
   التخطيط الرئيسي
===================================== */

.sd-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  grid-template-rows: auto 1fr;
  column-gap: 32px;
  padding-bottom: 48px;
}

.sd-layout.is-missing {
  grid-template-columns: minmax(0, 1fr);
}

/* =====================================
   العنوان والوصف والأزرار
===================================== */

.sd-hero__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px 24px;
  margin-top: 30px;
  border-bottom: 1px solid #be9c5a;
}

.sd-hero__title-group {
  flex: 1;
  min-width: 0;
}

.sd-hero h1 {
  font-size: clamp(26px, 3vw, 34px);
  font-weight: 700;
  line-height: 1.5;
  color: var(--sd-primary);
  overflow-wrap: anywhere;
}

.sd-hero__desc {
  width: 100%;
  max-width: none;
  margin-top: 12px;
  padding-bottom: 150px;
  font-size: 16px;
  line-height: 1.9;
  color: #3d4a44;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.sd-hero__actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  flex-shrink: 0;
  gap: 8px;
}

.sd-hero__actions .sd-btn {
  width: 100%;
}

.sd-copy {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  font-size: 15px;
  font-weight: 700;
  color: var(--sd-accent);
}

.sd-copy:hover span {
  text-decoration: underline;
}

/* =====================================
   الأزرار والروابط
===================================== */

.sd-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 18px;
  border-radius: var(--r-sm);
  font-size: 15px;
  font-weight: 700;
  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease;
}

.sd-btn--primary {
  background: var(--sd-primary);
  color: #fff;
}

.sd-btn--primary:hover {
  background: var(--sd-primary-hover);
}

.sd-btn--soft {
  width: 100%;
  background: var(--sd-soft);
  color: var(--text);
}

.sd-btn--soft:hover {
  background: #e8e5dc;
}

.sd-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  padding-inline-start: 2px;
  font-size: 14px;
  color: var(--sd-accent);
}

.sd-link:hover {
  text-decoration: underline;
}

.sd-link i {
  font-size: 11px;
}

.sd-btn:focus-visible,
.sd-copy:focus-visible,
.sd-tab:focus-visible,
.sd-link:focus-visible,
.sd-breadcrumb a:focus-visible {
  outline: 2px solid var(--sd-accent);
  outline-offset: 3px;
}

/* =====================================
   المعلومات الجانبية
===================================== */

.sd-aside {
  position: relative;
  z-index: 1;
  grid-column: 2;
  grid-row: 1 / span 2;
  align-self: start;
  margin-top: 28px;
  padding: 28px;
  border: 1px solid var(--sd-line);
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--shadow-sm);
}

.sd-facts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sd-fact dt,
.sd-aside-section h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.sd-fact dt i,
.sd-aside-section h2 i {
  width: 18px;
  font-size: 16px;
  text-align: center;
  color: var(--sd-accent);
}

.sd-fact dd {
  margin-top: 4px;
  padding-inline-start: 28px;
  font-size: 14px;
  line-height: 1.8;
  color: var(--sd-muted);
  white-space: pre-line;
  overflow-wrap: anywhere;
}

/* =====================================
   المحتوى الرئيسي
===================================== */

.sd-main {
  grid-column: 1;
  grid-row: 2;
  min-width: 0;
  margin-top: 20px;
}

.sd-tabs {
  display: none;
}

.sd-sections {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 5px;
}

.sd-section {
  display: block;
  min-width: 0;
  padding: 1px 0 0;
}

.sd-section:last-child {
  border-bottom: none;
}

.sd-section-title {
  margin-bottom: 4px;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.7;
  color: var(--sd-primary);
}

.sd-section .sd-list {
  margin: 0;
}

.sd-section .sd-empty {
  padding: 6px 0;
}

/* =====================================
   القوائم
===================================== */

.sd-panel {
  padding-top: 20px;
}

.sd-print-title {
  display: none;
  margin-bottom: 4px;
  font-size: 18px;
  font-weight: 700;
  color: var(--sd-primary);
}

.sd-list {
  list-style: none;
  counter-reset: sd-item;
}

.sd-list li {
  display: flex;
  gap: 1px;
  padding: 0;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.9;
  color: var(--text);
  overflow-wrap: anywhere;
  counter-increment: sd-item;
}

.sd-list li::before {
  content: counter(sd-item) "-";
  flex-shrink: 0;
  min-width: 26px;
  font-weight: 700;
  color: var(--sd-primary);
}

#panelFees #feesList {
  list-style: none !important;
  counter-reset: none !important;
  padding: 0 !important;
  margin: 0 !important;
}

#panelFees #feesList li {
  list-style: none !important;
  counter-increment: none !important;
}

#panelFees #feesList li::before,
#panelFees #feesList li::after {
  content: none !important;
}

#panelFees #feesList li::marker {
  content: none !important;
}

.sd-empty {
  padding: 20px 0;
  color: var(--sd-muted);
}

/* =====================================
   حالة عدم وجود الخدمة
===================================== */

.sd-missing {
  display: none;
  padding: 28px 24px;
  border: 1px dashed var(--sd-line);
  border-radius: 16px;
  background: #fff;
  text-align: center;
  color: var(--sd-muted);
}

.sd-missing .sd-btn {
  width: auto;
  margin-top: 16px;
}

.is-missing .sd-missing {
  display: block;
}

.is-missing .sd-hero__actions,
.is-missing .sd-copy,
.is-missing .sd-aside,
.is-missing .sd-tabs,
.is-missing .sd-panel {
  display: none;
}

/* =====================================
   قسم الملاحظات والمساعد الذكي
===================================== */

.sd-feedback {
  margin-bottom: 56px;
  text-align: center;
  padding: 28px;
  border: 1px solid var(--sd-line);
  border-radius: 16px;
  background: #fff;
}

.sd-feedback__icon {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  margin-inline: auto;
  border-radius: 50%;
  background: var(--sd-band);
  font-size: 18px;
  color: var(--sd-accent);
}

.sd-feedback h2 {
  margin-top: 16px;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

.sd-feedback p {
  margin-top: 8px;
  font-size: 15px;
  color: var(--sd-muted);
}

.sd-feedback .sd-btn {
  margin-top: 18px;
}

/* =====================================
   الشاشات المتوسطة
===================================== */

@media (max-width: 980px) {
  .sd-layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto;
  }

  .sd-hero,
  .sd-aside,
  .sd-main {
    grid-column: 1;
    grid-row: auto;
  }
}

/* =====================================
   الموبايل
===================================== */

@media (max-width: 600px) {
  .sd-layout {
    column-gap: 0;
    padding-bottom: 24px;
  }

  .sd-hero {
    min-width: 0;
    padding: 16px 0 20px;
  }

  .sd-hero__head {
    flex-direction: column;
    align-items: stretch;
    gap: 16px;
    margin-top: 15px;
    padding-bottom: 16px;
  }

  .sd-hero__title-group {
    width: 100%;
    min-width: 0;
  }

  .sd-hero h1 {
    width: 100%;
    font-size: 23px;
    line-height: 1.6;
    overflow-wrap: break-word;
    word-break: normal;
    white-space: normal;
  }

  .sd-hero__desc {
    padding-bottom: 20px;
    font-size: 14px;
    overflow-wrap: break-word;
    word-break: normal;
  }

  .sd-hero__actions {
    width: 100%;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }

  .sd-hero__actions .sd-btn {
    width: 100%;
    flex: none;
  }

  .sd-copy {
    align-self: stretch;
    justify-content: center;
    margin-top: 0;
    font-size: 13px;
  }

  .sd-aside {
    margin-top: 16px;
    padding: 18px;
  }

  .sd-main {
    margin-top: 20px;
    min-width: 0;
  }

  .sd-section-title {
    font-size: 17px;
  }

  .sd-list li {
    font-size: 14px;
    overflow-wrap: break-word;
    word-break: normal;
  }

  .sd-feedback {
    margin-bottom: 24px;
    padding: 20px 16px;
  }
}

/* =====================================
   الطباعة
===================================== */

@media print {
  body {
    background: #fff;
  }

  body::before,
  .header,
  .footer,
  .a11y-btn,
  .sd-hero__actions,
  .sd-copy,
  .sd-tabs,
  .sd-feedback,
  .sd-back {
    display: none !important;
  }

  .sd-layout {
    display: block;
    padding-bottom: 0;
  }

  .sd-hero {
    padding: 0 0 16px;
    background: none;
    box-shadow: none;
    clip-path: none;
  }

  .sd-aside {
    margin: 0 0 16px;
    box-shadow: none;
  }

  .sd-panel[hidden] {
    display: block !important;
  }

  .sd-print-title {
    display: block;
  }

  .sd-sections {
    gap: 16px;
  }

  .sd-section {
    padding: 12px 0;
    break-inside: avoid;
  }

  .sd-section-title {
    display: block;
  }
}

/* =====================================
   الفاصل الجانبي
===================================== */

.sd-aside .sd-divider:last-of-type {
  margin-bottom: 10px;
  margin-top: 10px;
}


    </style>
    <script src="../../js/i18n.js"></script>
  </head>
