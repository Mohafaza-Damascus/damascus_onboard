<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الاستثمارات في دمشق - محافظة دمشق</title>
    <link rel="icon" href="../images/brand/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/Investments.css" />
    <script src="../js/i18n.js"></script>
  </head>
  <body>
    <div id="site-header" data-active="الاستثمارات"></div>

    <main class="inv-page">
      <section class="inv-hero" id="investments-overview-section">
        <div class="inv-hero__stage">
          <img
            class="inv-hero__bg"
            src="../images/investments/hero.jpg"
            alt="تصوّر ليلي لممشى مشروع رحلة قاسيون المطلّ على دمشق"
          />

          <div class="inv-hero__content">
            <h1 class="inv-hero__title inv-display" data-split>دمشق كما لم ترها من قبل</h1>
            <p class="inv-hero__lead" data-reveal style="--d: 2">
              من سفوح جبل قاسيون، وجهة سياحية وثقافية جديدة تطلّ على العاصمة بأكملها.
            </p>

            <a
              href="https://qasiounjourney.com/"
              class="inv-btn"
              data-reveal
              style="--d: 3"
              target="_blank"
              rel="noopener"
            >
              <span class="inv-btn__icon"><i class="fa-solid fa-arrow-left"></i></span>
              <span>زيارة موقع رحلة قاسيون</span>
            </a>
          </div>
        </div>
      </section>

      <section class="inv-lmap" aria-label="خريطة التراخيص الموسمية">
        <div class="inv-wrap">
          <div class="inv-lmap__card">
            <div class="inv-lmap__aside" data-reveal>
              <a href="https://desktop-5kc9l5q.tail7e5653.ts.net:8443/" class="inv-btn inv-btn--green" target="_blank" rel="noopener">
                <span class="inv-btn__icon"><i class="fa-solid fa-arrow-left"></i></span>
                <span>اكتشف التوزيع للتراخيص الموسمية عبر الخريطة التفاعلية</span>
              </a>

              <p class="inv-lmap__legend">
                <span class="inv-lmap__legend-dot" aria-hidden="true"></span>
                مواقع التراخيص الموسمية
              </p>
            </div>

            <div class="inv-lmap__map" data-reveal style="--d: 1">
              <svg
                class="inv-lmap__svg"
                data-damascus-map
                data-sector-labels="false"
                data-license-map
                xmlns="http://www.w3.org/2000/svg"
                role="img"
                aria-label="خريطة دمشق مع مواقع التراخيص الموسمية"
              ></svg>
            </div>
          </div>

          <div class="inv-section-divider" aria-hidden="true">
            <span class="inv-section-divider__line"></span>
            <span class="inv-section-divider__diamond"></span>
            <span class="inv-section-divider__line"></span>
          </div>
        </div>
      </section>

      <section class="inv-opps" id="investment-opportunities">
        <div class="inv-wrap">
          <div class="inv-opps__head">
            <h2 class="inv-opps__title inv-display" data-split><em> استثمر معنا</em></h2>
          </div>
        </div>

        <div class="inv-map" id="project-showcase" aria-label="خارطة المشاريع">
          <div class="inv-map__pin">
            <div class="inv-wrap inv-map__top">
              <div class="inv-opps__filters" role="group" aria-label="تصفية الحقائب حسب القطاع" data-opps-filters></div>
              <div class="inv-map__counter inv-display">
                <span data-map-current>01</span> / <span data-map-total>15</span>
              </div>
            </div>
            <div class="inv-map__track" data-map-track tabindex="0"></div>
            <div class="inv-wrap inv-map__empty" data-map-empty hidden>
              <i class="fa-regular fa-folder-open"></i>
              <p>لا توجد حقائب استثمارية متاحة حالياً. تابعونا للاطلاع على الحقائب القادمة.</p>
            </div>
          </div>
        </div>
      </section>

      <section class="inv-embed" data-embed>
        <div class="inv-wrap">
          <div class="inv-embed__frame">
            <iframe
              src="https://desktop-5kc9l5q.tail7e5653.ts.net:8443/"
              title="محتوى مضمّن"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script src="../js/global.js"></script>
    <script src="../js/damascus-map.js"></script>
    <script src="../js/load-data.js" data-file="../js/opportunities-seed.js"></script>
    <script src="../js/opportunities-data.js"></script>
    <script src="../js/investments.js"></script>
  </body>
</html>
