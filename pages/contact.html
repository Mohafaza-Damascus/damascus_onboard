<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تواصل معنا - محافظة دمشق</title>
    <link rel="icon" href="../images/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/contact.css" />
  </head>
  <body>
    <main class="contact-page">
      <div class="contact-bg">
        <img src="../images/Damascus.png" alt="" aria-hidden="true" />
      </div>

      <div class="contact-card">
        <!-- زر الإغلاق -->
        <button
          class="contact-close"
          aria-label="إغلاق"
          onclick="history.back()"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>

        <div class="contact-head">
          <div class="contact-head__info">
            <h1 class="contact-head__title">صوتك يصل الينا</h1>
            <p class="contact-head__sub">نسعد بتواصلك معنا</p>
          </div>
          <figure class="contact-head__logo">
            <img src="../images/footer_logo.png" alt="محافظة دمشق" />
          </figure>
        </div>

        <div class="contact-form">
          <div class="contact-col">
            <div class="contact-field">
              <label for="fullName">الاسم الكامل</label>
              <input type="text" id="fullName" name="fullName" required />
            </div>
            <div class="contact-field">
              <label for="email">البريد الالكتروني</label>
              <input type="email" id="email" name="email" required />
            </div>
          </div>

          <div class="contact-col">
            <div class="contact-field">
              <label for="subject">الموضوع</label>
              <input type="text" id="subject" name="subject" required />
            </div>
            <div class="contact-field">
              <label for="suggestion">المقترح</label>
              <textarea
                id="suggestion"
                name="suggestion"
                rows="4"
                placeholder="اكتب مقترحك هنا..."
              ></textarea>
            </div>
          </div>
        </div>

        <button type="button" class="contact-submit" id="submitBtn">
          إرسال
        </button>
      </div>
    </main>

    <button class="a11y-btn" aria-label="إمكانية الوصول">
      <img src="../images/Standing Man.png" alt="" />
    </button>

    <script src="../js/global.js"></script>
    <script src="../js/services.js"></script>
    <script src="../js/index.js"></script>
    <script>
      document.getElementById("submitBtn")?.addEventListener("click", () => {
        const name = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        if (!name || !email) {
          alert("يرجى ملء الاسم والبريد الالكتروني");
          return;
        }
        alert("شكراً لتواصلك! تم إرسال رسالتك بنجاح.");
      });
    </script>
  </body>
</html>
