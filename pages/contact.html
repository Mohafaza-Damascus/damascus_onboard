<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تواصل معنا - محافظة دمشق</title>
    <link rel="icon" href="../images/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/contact.css" />
    <script src="../js/i18n.js"></script>
  </head>
  <body dir="rtl">
    <div id="site-header" data-active="تواصل معنا"></div>

    <div class="contact-section">
      <div class="contact-wrap">
        <div class="contact-form-side">
          <div class="contact-form-title">صوتك يصل إلينا</div>
          <div class="contact-form-sub">نسعد بتواصلك معنا</div>

          <div class="contact-field">
            <label>الاسم الكامل</label>
            <input type="text" placeholder="أدخل اسمك" />
          </div>
          <div class="contact-field">
            <label>البريد الإلكتروني</label>
            <input type="email" placeholder="example@mail.com" />
          </div>
          <div class="contact-field">
            <label>الموضوع</label>
            <input type="text" placeholder="موضوع رسالتك" />
          </div>
          <div class="contact-field">
            <label>المقترح</label>
            <textarea placeholder="اكتب مقترحك هنا..."></textarea>
          </div>

          <button class="contact-send-btn">إرسال</button>
        </div>

        <div class="contact-info-side">
          <div class="contact-info-title">اقتراحات</div>
          <div class="contact-gold-bar"></div>

          <div class="contact-info-row">
            <img src="../images/icons/phone.svg" alt="هاتف" />
            <div class="contact-info-text">011-2234567<br />+963 999 123 456</div>
          </div>
          <div class="contact-info-row">
            <img src="../images/icons/email.svg" alt="بريد" />
            <div class="contact-info-text">damascus@moi.gov.sy</div>
          </div>
          <div class="contact-info-row">
            <img src="../images/icons/location.svg" alt="عنوان" />
            <div class="contact-info-text">دمشق — ساحة يوسف العظمة</div>
          </div>

          <div class="contact-social-row">
            <a href="https://t.me/DamascusGov1" class="contact-social-btn" aria-label="Telegram">
              <img src="../images/social/telegram.png" alt="" />
            </a>
            <a href="https://x.com/DamascusGov1?s=20" class="contact-social-btn" aria-label="X">
              <img src="../images/social/twitter.png" alt="" />
            </a>
            <a href="https://www.facebook.com/DamascusGov1" class="contact-social-btn" aria-label="Facebook">
              <img src="../images/social/facebook.png" alt="" />
            </a>
            <a href="https://www.instagram.com/damascusgov1" class="contact-social-btn" aria-label="Instagram">
              <img src="../images/social/instagram.png" alt="" />
            </a>
          </div>
        </div>
      </div>
    </div>
    <div id="site-footer"></div>
    <script src="../js/global.js"></script>
  </body>
</html>
