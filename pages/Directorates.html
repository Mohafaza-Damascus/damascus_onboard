<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دليل دمشق - محافظة دمشق</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/Directorates.css" />
  </head>
  <body>
    <div class="bg-vector-top"></div>

    <div id="site-header" data-active="دليل دمشق"></div>

    <section class="dir-hero">
      <div class="dir-hero__text">
        <h1>أي خدمة ؟</h1>
        <p>استثمر وقتك بفعالية، واستفد من خدماتنا المتميزة في دقائق معدودة</p>
      </div>
      <div class="dir-search">
        <button class="dir-search__btn" aria-label="بحث">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2.5"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
        <div class="dir-search__field">
          <input
            type="text"
            id="searchInput"
            placeholder="ابحث عن خدمة، وزارة أو فئة"
          />
        </div>
      </div>
    </section>
    <main class="dir-main">
      <div class="dir-grid">
        <div class="dir-card">
          <div class="dir-card__badge"><span>مديرية الشكاوى</span></div>
        </div>
        <div class="dir-card">
          <div class="dir-card__badge"><span>مديرية المالية</span></div>
        </div>
        <div class="dir-card">
          <div class="dir-card__badge"><span>مديرية المهن والرخص</span></div>
        </div>
        <div class="dir-card">
          <div class="dir-card__badge">
            <span>مديرية التخطيط العمراني</span>
          </div>
        </div>
        <div class="dir-card">
          <div class="dir-card__badge"><span>مديرية السجل المؤقت</span></div>
        </div>
        <div class="dir-card">
          <div class="dir-card__badge"><span>مديرية المرسوم 66</span></div>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/global.js"></script>
    <script src="../js/index.js"></script>
    <script src="../js/Directorates.js"></script>
  </body>
</html>
