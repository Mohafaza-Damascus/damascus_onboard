<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/service-cards.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body { background: #ede7d9; padding: 30px; font-family: system-ui, sans-serif; }
      .row { display: grid; grid-template-columns: repeat(2, 360px); gap: 24px; }
      h2 { color: #064239; margin: 0 0 12px; font-size: 18px; }
      img { width: 744px; border-radius: 12px; display: block; margin-bottom: 24px; }
    </style>
  </head>
  <body>
    <h2>الصورة لحالها</h2>
    <img src="excavation.svg" alt="" />
    <h2>على البطاقة بالموقع (عادي / عند تمرير الماوس)</h2>
    <div class="row">
      <article class="svc-card">
        <span class="svc-card__img" style="background-image: url('excavation.svg')"></span>
        <span class="svc-card__arrow"><i class="fa-solid fa-arrow-left"></i></span>
        <div class="svc-card__body">
          <span class="svc-card__tag">المهن والرخص</span>
          <h3 class="svc-card__title">تصريح حفر</h3>
        </div>
        <div class="svc-card__actions">
          <a class="svc-card__btn svc-card__btn--ghost" href="#">عرض الدليل</a>
          <a class="svc-card__btn" href="#">ابدأ الخدمة <i class="fa-solid fa-arrow-left"></i></a>
        </div>
      </article>
      <article class="svc-card hover-demo">
        <span class="svc-card__img" style="background-image: url('excavation.svg')"></span>
        <span class="svc-card__arrow"><i class="fa-solid fa-arrow-left"></i></span>
        <div class="svc-card__body">
          <span class="svc-card__tag">المهن والرخص</span>
          <h3 class="svc-card__title">تصريح حفر</h3>
        </div>
        <div class="svc-card__actions">
          <a class="svc-card__btn svc-card__btn--ghost" href="#">عرض الدليل</a>
          <a class="svc-card__btn" href="#">ابدأ الخدمة <i class="fa-solid fa-arrow-left"></i></a>
        </div>
      </article>
    </div>
    <style>
      .hover-demo::before {
        background: linear-gradient(to bottom, rgba(74, 21, 30, 0.95) 0%, rgba(74, 21, 30, 0.8) 35%, rgba(179, 112, 118, 0.1) 100%);
      }
    </style>
  </body>
</html>
